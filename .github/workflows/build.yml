name: Make Admin App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Setup builder tools
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Build the App and Set the Name
        run: |
          mkdir www
          
          # Copy your files
          cp index.html www/
          cp native-share.js www/ || true
          
          npm init -y
          
          # UPGRADED TO CAPACITOR 6 (Fixes the "Older Version" warning)
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6 @capacitor/assets
          
          # Install Native Plugins at version 6
          npm install @capacitor/app@6 @capacitor/status-bar@6 @capacitor/splash-screen@6 @capacitor/filesystem@6 @capacitor/share@6
          
          # Configure the App
          echo '{
            "appId": "com.sarkarenterprises.admin",
            "appName": "Admin",
            "webDir": "www",
            "backgroundColor": "#ffffff",
            "plugins": {
              "StatusBar": {
                "overlaysWebView": true,
                "style": "LIGHT"
              },
              "SplashScreen": {
                "launchShowDuration": 1500,
                "backgroundColor": "#ffffff",
                "showSpinner": false
              }
            }
          }' > capacitor.config.json
          
          npx cap add android

      - name: Setup Your Logo
        run: |
          mkdir assets
          cp logo.png assets/icon.png
          npx @capacitor/assets generate --android

      - name: Create the APK file
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Save the APK for you to download
        uses: actions/upload-artifact@v4
        with:
          name: Sarkar-Admin-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
